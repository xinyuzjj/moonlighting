<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin:0; font-family: var(--app-font, system-ui); color: var(--foreground); }
  .bar { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted-foreground); padding:6px 0; }
  .dot { width:8px; height:8px; border-radius:50%; background:#22c55e; }
  .dot.warn { background:#f59e0b; }
  .dot.dead { background:#ef4444; }
  .frame { border:1px solid var(--border); border-radius:10px; overflow:hidden; width:100%; position:relative; cursor:crosshair; }
  canvas { display:block; width:100%; height:auto; }
  .hint { font-size:12px; color:var(--muted-foreground); padding:20px; position:absolute; inset:0;
          display:flex; align-items:center; justify-content:center; pointer-events:none; }
  input.cap { width:1px; height:1px; margin:0; padding:0; border:0; opacity:0; position:absolute; pointer-events:none;
              border:1px solid var(--border); border-radius:8px; background:transparent; color:var(--foreground); }
  code { color:var(--foreground); }
</style>
</head>
<body>
  <div class="bar">
    <span class="dot" id="dot"></span>
    <span>HermesDesk · 可操作</span>
    <code id="stat">连接中…</code>
  </div>
  <div class="frame" id="frame">
    <canvas id="cv"></canvas>
    <div class="hint" id="hint">等待第一帧…</div>
  </div>
  <input class="cap" id="cap" aria-label="键盘输入">

<script>
(function () {
  var BASE = "http://127.0.0.1:8765";
  var TOKEN = "__TOKEN__";   // 由服务端注入
  var cv = document.getElementById("cv");
  var ctx = cv.getContext("2d");
  var hint = document.getElementById("hint");
  var stat = document.getElementById("stat");
  var dot = document.getElementById("dot");
  var cap = document.getElementById("cap");
  var seq = 0, fails = 0, busy = false;

  function tick() {
    if (busy) { setTimeout(tick, 120); return; }
    busy = true;
    var probe = new Image();
    probe.onload = function () {
      fails = 0; dot.className = "dot";
      if (cv.width !== probe.naturalWidth || cv.height !== probe.naturalHeight) {
        cv.width = probe.naturalWidth; cv.height = probe.naturalHeight;
      }
      ctx.drawImage(probe, 0, 0);
      if (hint.parentNode) hint.remove();
      stat.textContent = "帧 " + (++seq);
      busy = false; setTimeout(tick, 260);
    };
    probe.onerror = function () {
      fails++;
      dot.className = fails > 3 ? "dot dead" : "dot warn";
      stat.textContent = fails > 3 ? "推流断了" : "丢帧";
      busy = false; setTimeout(tick, 600);
    };
    probe.src = BASE + "/snapshot?t=" + Date.now();
  }
  tick();

  cv.addEventListener("click", function (e) {
    var r = cv.getBoundingClientRect();
    var nx = (e.clientX - r.left) / r.width;
    var ny = (e.clientY - r.top) / r.height;
    fetch(BASE + "/c?nx=" + nx.toFixed(4) + "&ny=" + ny.toFixed(4) + "&token=" + TOKEN)
      .then(function (r) { return r.json(); })
      .then(function (j) { stat.textContent = "点击 " + j.window.map(function (v) { return Math.round(v); }).join(","); })
      .catch(function () { stat.textContent = "输入通道没开"; });
    cap.focus({ preventScroll: true });
  });

  cap.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      e.preventDefault();
      fetch(BASE + "/k?key=Enter&token=" + TOKEN);
      cap.value = "";
      return;
    }
    if (e.key === "Backspace") { e.preventDefault(); fetch(BASE + "/k?key=Backspace&token=" + TOKEN); return; }
    if (e.key === "Tab") { e.preventDefault(); fetch(BASE + "/k?key=Tab&token=" + TOKEN); return; }
  });

  var pending = "";
  var timer = null;
  cap.addEventListener("input", function () {
    var v = cap.value;
    if (!v) return;
    pending += v;
    cap.value = "";
    if (timer) clearTimeout(timer);
    timer = setTimeout(function () {
      var t = pending; pending = "";
      if (t) fetch(BASE + "/t?text=" + encodeURIComponent(t) + "&token=" + TOKEN);
    }, 40);
  });
})();
</script>
</body>
</html>
